name: Collect listings and deploy

on:
  schedule:
    - cron: "0 5,15 * * *"   # 06:00 / 16:00 Warsaw time (winter)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect-and-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # A code push only redeploys the site; collection runs on schedule or on demand.
      - name: Collect listings
        if: github.event_name != 'push'
        run: python -u -m scraper.run

      - name: Commit updated data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || git commit -m "Update listings $(date -u +%Y-%m-%dT%H:%MZ)"
          # main may have moved during a long run: replay on top, this run's data wins.
          git pull --rebase -X theirs origin main
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
