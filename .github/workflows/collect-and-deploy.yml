name: Collect listings and deploy

on:
  schedule:
    # Every 3 hours, off the hour: GitHub delays or drops runs scheduled at :00,
    # so a frequent, off-peak schedule keeps the data fresh even when some are skipped.
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

# Code pushes (deploy only) must not wait behind a 30-minute collection, so they get
# their own group. A collection deploys at its end from the rebased latest main,
# so it never brings back an older page.
concurrency:
  group: ${{ github.event_name == 'push' && 'deploy-only' || 'collect' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # Always build from the latest main: a queued run must not redeploy older data.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # A code push only redeploys the site; collection runs on schedule or on demand.
      - name: Collect listings
        if: github.event_name != 'push'
        run: python -u -m scraper.run

      - name: Commit updated data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || git commit -m "Update listings $(date -u +%Y-%m-%dT%H:%MZ)"
          # main may have moved during a long run: replay on top, this run's data wins.
          git pull --rebase -X theirs origin main
          git push

      # Pages caches every file for 10 min independently: stamp the assets with the commit
      # so a phone never runs a new page with an old script (or the reverse).
      - name: Version static assets
        run: sed -i "s/__BUILD__/$(git rev-parse --short HEAD)/g" site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
