<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1A1815">
<title>NOS/NOS Annonces</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>NOS/NOS <span>Annonces</span></h1>
  <div class="meta" id="summary">Chargement…</div>
</header>
<div class="toolbar">
  <button class="btn" id="open-filters" type="button">Filtres <span class="n" id="filter-count" hidden></span></button>
  <button class="btn" id="fav-toggle" type="button" aria-pressed="false">★ Favoris <span class="n" id="fav-count" hidden></span></button>
  <select id="sort" aria-label="Trier">
    <option value="recent">Plus récentes</option>
    <option value="price">Coût mensuel croissant</option>
    <option value="ppm">Prix/m² croissant</option>
    <option value="area-asc">Surface croissante</option>
    <option value="area-desc">Surface décroissante</option>
  </select>
</div>
<div class="count" id="count"></div>
<div class="tabs" role="tablist">
  <button role="tab" aria-selected="true" data-view="list">Liste</button>
  <button role="tab" aria-selected="false" data-view="map">Carte</button>
</div>
<main>
  <div id="list"></div>
  <div id="map"></div>
</main>

<div class="sheet" id="filters" aria-hidden="true">
  <div class="backdrop" data-close></div>
  <div class="panel" role="dialog" aria-label="Filtres">
    <button class="close" type="button" data-close aria-label="Fermer">×</button>
    <h2>Filtres</h2>
    <div class="field">
      <span class="label">Surface (m²)</span>
      <div class="row">
        <input type="number" id="f-area-min" inputmode="numeric" min="0" step="5" placeholder="min" aria-label="Surface minimale">
        <span>à</span>
        <input type="number" id="f-area-max" inputmode="numeric" min="0" step="5" placeholder="max" aria-label="Surface maximale">
      </div>
      <div class="hint" id="area-hint"></div>
    </div>
    <div class="field">
      <label for="f-budget">Coût mensuel max (PLN/mois)</label>
      <input type="number" id="f-budget" inputmode="numeric" min="0" step="500" style="width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface)">
      <label class="check"><input type="checkbox" id="f-unknown-price"> Inclure les annonces sans prix</label>
      <div class="hint" id="rate-hint"></div>
    </div>
    <div class="field">
      <label class="check"><input type="checkbox" id="f-ground"> Rez-de-chaussée uniquement</label>
      <label class="check"><input type="checkbox" id="f-new"> Nouveautés seulement (publiées il y a moins de 7 jours)</label>
    </div>
    <div class="field">
      <span class="label">Quartiers</span>
      <div class="chips" id="f-districts"></div>
      <div class="hint">Powiśle est dans Śródmieście, Saska Kępa dans Praga-Południe, Filtry dans Ochota.</div>
    </div>
    <div class="actions">
      <button class="btn" type="button" id="reset-filters">Réinitialiser</button>
      <button class="btn primary" type="button" data-close id="apply-filters">Voir les annonces</button>
    </div>
  </div>
</div>

<div class="sheet" id="detail" aria-hidden="true">
  <div class="backdrop" data-close></div>
  <div class="panel detail" role="dialog" aria-label="Annonce">
    <button class="close" type="button" data-close aria-label="Fermer">×</button>
    <div id="detail-body"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="app.js"></script>
</body>
</html>
