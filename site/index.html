<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1A1815">
<title>NOS/NOS Annonces</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    --bg: #F5F0E8; --surface: #FFFFFF; --text: #1A1815; --muted: #6B665F;
    --line: #E2DBCF; --accent: #C4963C; --ok: #4F7A5A; --warn: #B4532A;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151311; --surface: #1F1C19; --text: #F1ECE4; --muted: #A39C92; --line: #36312B; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { padding: 12px 16px 8px; padding-top: max(12px, env(safe-area-inset-top)); }
  h1 { margin: 0; font-size: 18px; letter-spacing: .02em; }
  h1 span { color: var(--accent); }
  .meta { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .tabs { display: flex; gap: 8px; padding: 0 16px 10px; }
  .tabs button { flex: 1; padding: 10px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--surface); color: var(--text); font: inherit; font-weight: 600; }
  .tabs button[aria-selected="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
  main { position: relative; }
  #list { padding: 0 16px 24px; display: grid; gap: 12px; }
  #map { height: calc(100dvh - 120px); display: none; }
  body.show-map #map { display: block; }
  body.show-map #list { display: none; }
  .card { display: flex; gap: 12px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 12px; padding: 10px; color: inherit; text-decoration: none; }
  .card img, .card .noimg { width: 96px; height: 72px; object-fit: cover; border-radius: 8px;
    background: var(--line); flex: none; }
  .card .t { font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card .p { margin-top: 4px; font-weight: 700; }
  .card .s { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 6px;
    background: var(--accent); color: #fff; margin-right: 4px; vertical-align: 1px; }
  .status { padding: 0 16px 8px; font-size: 13px; color: var(--muted); }
  .status .err { color: var(--warn); }
  .empty { padding: 32px 16px; text-align: center; color: var(--muted); }
  .leaflet-popup-content { margin: 10px 12px; font: 14px/1.35 system-ui, sans-serif; }
  .leaflet-popup-content a { color: inherit; }
  @media (min-width: 900px) {
    main { display: grid; grid-template-columns: 420px 1fr; }
    .tabs { display: none; }
    #list { display: grid !important; max-height: calc(100dvh - 90px); overflow: auto; align-content: start; }
    #map { display: block !important; height: calc(100dvh - 90px); }
  }
</style>
</head>
<body>
<header>
  <h1>NOS/NOS <span>Annonces</span></h1>
  <div class="meta" id="summary">Chargement…</div>
</header>
<div class="status" id="sources"></div>
<div class="tabs" role="tablist">
  <button role="tab" aria-selected="true" data-view="list">Liste</button>
  <button role="tab" aria-selected="false" data-view="map">Carte</button>
</div>
<main>
  <div id="list"></div>
  <div id="map"></div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const FLOORS = { GROUND: "RDC", FIRST: "1er", SECOND: "2e", THIRD: "3e", FOURTH: "4e", FIFTH: "5e",
  SIXTH: "6e", SEVENTH: "7e", EIGHTH: "8e", NINTH: "9e", TENTH: "10e", ABOVE_TENTH: ">10e",
  CELLAR: "sous-sol", GARRET: "combles" };
const fmt = (n, d = 0) => n == null ? null : n.toLocaleString("fr-FR", { maximumFractionDigits: d });
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const ago = iso => {
  const d = Math.floor((Date.now() - new Date(iso)) / 86400000);
  return d <= 0 ? "aujourd'hui" : d === 1 ? "hier" : `il y a ${d} j`;
};
function price(l) {
  if (l.rent == null) return "Prix non indiqué";
  const cur = l.rent_currency === "EUR" ? "€" : "PLN";
  const perM2 = l.area_m2 ? ` · ${fmt(l.rent / l.area_m2, 1)} ${cur}/m²` : "";
  return `${fmt(l.rent)} ${cur}/mois${perM2}`;
}
function sub(l) {
  return [l.area_m2 && `${fmt(l.area_m2, 1)} m²`, FLOORS[l.floor] || null,
    [l.district, l.neighbourhood].filter(Boolean).join(" · ")].filter(Boolean).join(" · ");
}
function isNew(l) { return Date.now() - new Date(l.first_seen) < 3 * 86400000; }

let map, layer;
function initMap() {
  map = L.map("map", { zoomControl: true }).setView([52.2297, 21.0122], 12);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19, attribution: "© OpenStreetMap"
  }).addTo(map);
  layer = L.layerGroup().addTo(map);
}

function render(listings) {
  const active = listings.filter(l => !l.gone_since);
  document.getElementById("list").innerHTML = active.length ? active.map(l => `
    <a class="card" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">
      ${l.thumbnail ? `<img loading="lazy" referrerpolicy="no-referrer" src="${esc(l.thumbnail)}" alt="">` : `<div class="noimg"></div>`}
      <div>
        <div class="t">${isNew(l) ? '<span class="badge">Nouveau</span>' : ""}${esc(l.title)}</div>
        <div class="p">${esc(price(l))}</div>
        <div class="s">${esc(sub(l))}</div>
        <div class="s">${esc(l.source)} · ${esc(ago(l.created_at || l.first_seen))}</div>
      </div>
    </a>`).join("") : `<div class="empty">Aucune annonce pour l'instant.</div>`;

  layer.clearLayers();
  for (const l of active) {
    if (l.lat == null) continue;
    L.circleMarker([l.lat, l.lng], {
      radius: 7, weight: 2, color: "#1A1815", fillColor: isNew(l) ? "#C4963C" : "#7A8C7E",
      fillOpacity: .9, dashArray: l.location_precise ? null : "3 3"
    }).bindPopup(`<a href="${esc(l.url)}" target="_blank" rel="noopener noreferrer"><b>${esc(l.title)}</b></a><br>
      ${esc(price(l))}<br>${esc(sub(l))}${l.location_precise ? "" : "<br><i>Position approximative</i>"}`)
      .addTo(layer);
  }
}

function renderMeta(meta, listings) {
  const active = listings.filter(l => !l.gone_since).length;
  const onMap = listings.filter(l => !l.gone_since && l.lat != null).length;
  document.getElementById("summary").textContent = meta.updated_at
    ? `${active} annonces (${onMap} sur la carte) · mis à jour ${new Date(meta.updated_at).toLocaleString("fr-FR", { dateStyle: "short", timeStyle: "short" })}`
    : "Pas encore de collecte.";
  document.getElementById("sources").innerHTML = Object.entries(meta.sources || {}).map(([name, s]) =>
    s.error ? `<span class="err">⚠ ${esc(name)} : échec de la dernière collecte</span>`
            : `${esc(name)} ✓ ${s.count ?? 0}`).join(" · ");
}

document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".tabs button").forEach(x => x.setAttribute("aria-selected", x === b));
  document.body.classList.toggle("show-map", b.dataset.view === "map");
  if (b.dataset.view === "map") map.invalidateSize();
}));

initMap();
Promise.all([
  fetch("data/listings.json", { cache: "no-cache" }).then(r => r.ok ? r.json() : []),
  fetch("data/meta.json", { cache: "no-cache" }).then(r => r.ok ? r.json() : {}),
]).then(([listings, meta]) => { renderMeta(meta, listings); render(listings); })
  .catch(() => { document.getElementById("summary").textContent = "Impossible de charger les données."; });
</script>
</body>
</html>
